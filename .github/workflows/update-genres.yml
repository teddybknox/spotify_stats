name: Update genres

# Looks up Deezer genres for the artists in data/genre-queue.txt and commits them to public/genres.json.
on:
  workflow_dispatch:
  push:
    paths: [data/genre-queue.txt]

permissions:
  contents: write

concurrency:
  group: update-genres-${{ github.ref }}
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx tsx scripts/update-genres.ts
      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898341+github-actions[bot]@users.noreply.github.com"
          git add public/genres.json data/genre-queue.txt
          if git diff --cached --quiet; then echo "Nothing new"; exit 0; fi
          git commit -m "Update artist genres from Deezer"
          git push origin HEAD:${{ github.ref_name }}
