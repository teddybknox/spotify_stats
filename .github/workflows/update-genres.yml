name: Update genres

# Looks up Deezer genres for the artists in data/genre-queue.txt and commits them to public/genres.json.
on:
  workflow_dispatch:
    inputs:
      top_artists:
        description: Also queue this many of the most-listened artists on Spotify (from kworb.net), e.g. 10000
        required: false
        default: '0'
  push:
    paths: [data/genre-queue.txt]

permissions:
  contents: write
  actions: write # lets a run start the next one while artists are still queued

concurrency:
  group: update-genres-${{ github.ref }}
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - if: ${{ inputs.top_artists && inputs.top_artists != '0' }}
        run: npx tsx scripts/queue-top-artists.ts ${{ inputs.top_artists }}
      - run: npx tsx scripts/update-genres.ts
      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898341+github-actions[bot]@users.noreply.github.com"
          git add public/genres.json data/genre-queue.txt
          if git diff --cached --quiet; then echo "Nothing new"; exit 0; fi
          git commit -m "Update artist genres from Deezer"
          git push origin HEAD:${{ github.ref_name }}
      - name: Continue if artists are still queued
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -s data/genre-queue.txt ]; then
            echo "$(wc -l < data/genre-queue.txt) artists left; starting another run"
            gh workflow run update-genres.yml --ref ${{ github.ref_name }}
          fi
